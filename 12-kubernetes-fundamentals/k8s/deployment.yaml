apiVersion: apps/v1
kind: Deployment
metadata:
  name: rusticos-diniz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rusticos-diniz
  template:
    metadata:
      labels:
        app: rusticos-diniz
    spec:
      containers:
        - name: site
          image: rusticos-diniz:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false